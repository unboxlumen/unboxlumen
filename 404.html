<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 | UnboxLumen</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#F6F2E8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="canonical" href="https://unboxlumen.com/">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F6F2E8; color: #111111; line-height: 1.7;
    min-height: 100vh; display: grid; place-items: center;
  }
  .box { text-align: center; padding: 40px 24px; }
  .mark {
    width: 56px; height: 56px; border-radius: 50%;
    background: #111111; color: #fff; margin: 0 auto 28px;
    display: grid; place-items: center;
    font-family: Consolas, Menlo, monospace; font-weight: 700; font-size: 20px;
  }
  .code { font-family: Consolas, Menlo, monospace; font-size: 14px; letter-spacing: 0.22em; color: #6e6e73; }
  h1 { margin-top: 14px; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin-top: 12px; color: #6e6e73; font-size: 15px; }
  .links { margin-top: 34px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  a {
    display: inline-flex; align-items: center; padding: 12px 26px; border-radius: 999px;
    font-family: Consolas, Menlo, monospace; font-size: 13px; font-weight: 600;
    text-decoration: none;
  }
  .primary { background: #111111; color: #fff; }
  .primary:hover { opacity: 0.88; }
  .ghost { border: 1px solid rgba(0, 0, 0, 0.16); color: #111111; }
  .ghost:hover { border-color: #111111; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">UL</div>
    <div class="code">ERROR // 404</div>
    <h1>页面不存在</h1>
    <p>你访问的页面可能已被移动或删除。</p>
    <div class="links">
      <a class="primary" href="/">返回主页</a>
      <a class="ghost" href="/nbrowser/">N 浏览器</a>
      <a class="ghost" href="/filemanager/">N 文件</a>
    </div>
  </div>
</body>
</html>
