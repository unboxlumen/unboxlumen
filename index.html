<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnboxLumen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eaeaea;
    }
    .card { text-align: center; padding: 48px 32px; }
    .logo {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #7ec8ff, #b39dfb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { margin-top: 16px; font-size: 18px; color: #a8b3c5; }
    .status {
      margin-top: 32px;
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      background: rgba(126, 200, 255, 0.12);
      border: 1px solid rgba(126, 200, 255, 0.35);
      color: #7ec8ff;
    }
    .footer { margin-top: 48px; font-size: 13px; color: #5f6b80; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">UnboxLumen</div>
    <p class="subtitle">GitHub Pages 占位首页 · 站点已就绪</p>
    <span class="status">● Hosted on GitHub Pages</span>
    <p class="footer">© 2026 UnboxLumen Project</p>
  </div>
</body>
</html>
